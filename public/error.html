<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Fatal error</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:28px 20px;
    background:#ffffff;
    color:#1a1a1a;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
    font-size:15px;
    line-height:1.7;
  }
  main{width:100%;max-width:520px}
  h1{
    font-size:16px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#a00000;
    margin-bottom:18px;
  }
  hr{border:0;border-top:1px solid #d8d8d8;margin:18px 0}
  p{margin-bottom:6px}

  .kod{color:#767676;font-size:13.5px}

  /* Vstup do aplikace v levém dolním rohu — vypadá jako zbytková technická
     poznámka: drobné, světle šedé, bez podtržení, kurzor se nemění. */
  #vstup{
    position:fixed;
    left:14px;
    bottom:12px;
    font:inherit;
    font-size:11.5px;
    color:#b4b4b4;
    background:none;
    border:0;
    padding:6px;
    cursor:default;
    -webkit-tap-highlight-color:transparent;
  }
  #vstup:focus{outline:0}
</style>
</head>
<body>
  <main>
    <h1>Fatal error</h1>
    <p>Web byl pozastaven.</p>
    <hr />
    <p class="kod">Error 503 &middot; Service unavailable</p>
  </main>

  <button id="vstup" type="button" tabindex="-1">error</button>

<script>
(function () {
  /* Aplikace PORT běží na stejné doméně ve složce /port/ */
  document.getElementById("vstup").addEventListener("click", function () {
    window.location.href = "/port/";
  });
})();
</script>
</body>
</html>
