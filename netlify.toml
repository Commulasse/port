[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Kořen webu je chybová stránka (dist/index.html).
# Aplikace PORT je skutečný soubor dist/port/index.html — žádný přepis není potřeba.
# Zbývá jen zachytit adresy uvnitř aplikace a neznámé adresy.

[[redirects]]
  from = "/port/*"
  to = "/port/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
